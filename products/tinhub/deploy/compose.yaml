# tinhub and Postgres on one host, content in an S3-compatible bucket (R2 by default):
#   TINHUB_S3_ENDPOINT=https://ACCOUNT_ID.r2.cloudflarestorage.com TINHUB_S3_BUCKET=tinhub TINHUB_S3_ACCESS_KEY=... \
#     docker compose -f products/tinhub/deploy/compose.yaml up
# (or put those in a .env file beside this one). Put the secrets in ./secrets/{db,nonce,cookie,s3} first, s3 being the
# bucket's secret access key (deploy/RUNBOOK.md). The packs volume is the node's cache and scratch space only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tinhub
      POSTGRES_DB: tinhub
      POSTGRES_PASSWORD_FILE: /run/secrets/db
    secrets: [db]
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "tinhub"]
      interval: 2s
  tinhub:
    build:
      context: ../../..
      dockerfile: products/tinhub/deploy/Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      TINHUB_DB_ADDR: postgres:5432
      TINHUB_DB_PASSWORD: file:/run/secrets/db
      TINHUB_SECRETS_NONCE: file:/run/secrets/nonce
      TINHUB_SECRETS_COOKIE: file:/run/secrets/cookie
      TINHUB_PACKS_STORE: s3
      TINHUB_S3_ENDPOINT: ${TINHUB_S3_ENDPOINT:?set TINHUB_S3_ENDPOINT to the bucket's endpoint, https://ACCOUNT_ID.r2.cloudflarestorage.com for R2}
      TINHUB_S3_REGION: ${TINHUB_S3_REGION:-auto}
      TINHUB_S3_BUCKET: ${TINHUB_S3_BUCKET:?set TINHUB_S3_BUCKET}
      TINHUB_S3_ACCESS_KEY: ${TINHUB_S3_ACCESS_KEY:?set TINHUB_S3_ACCESS_KEY}
      TINHUB_S3_SECRET_KEY: file:/run/secrets/s3
      TINHUB_S3_PATH_STYLE: ${TINHUB_S3_PATH_STYLE:-true}
    secrets: [db, nonce, cookie, s3]
    volumes: [packs:/var/lib/tinhub]
    ports: ["8080:8080"]
    stop_grace_period: 45s
secrets:
  db: {file: ./secrets/db}
  nonce: {file: ./secrets/nonce}
  cookie: {file: ./secrets/cookie}
  s3: {file: ./secrets/s3}
volumes:
  pg: {}
  packs: {}
