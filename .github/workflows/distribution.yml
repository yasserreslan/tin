name: Distribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Archive and container (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-24.04
            target: linux-amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Docker Hub limits unauthenticated pulls per runner address (429 Too Many Requests): the images the
      # checks run (spawn_check, static_check, distribution_check) come from Google's mirror of it and are
      # tagged under their Docker Hub names, so docker run and docker build find them locally.
      - name: Docker images from the Docker Hub mirror
        if: runner.os == 'Linux'
        run: |
          for image in debian:bookworm-slim alpine:3.20; do
            for attempt in 1 2 3; do
              docker pull -q "mirror.gcr.io/library/$image" && break
              sleep 5
            done
            docker tag "mirror.gcr.io/library/$image" "$image" || echo "::warning::$image not taken from mirror.gcr.io; Docker Hub is pulled instead"
          done
      - run: sh tools/ci/tin.sh test_distribution
      - run: make bootstrap dist
      - name: Verify archive and Linux containers
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(cat VERSION)
          if [ "$RUNNER_OS" = Linux ]; then
            sh tools/ci/tin.sh distribution_check "bin/dist/tin-$version-$TARGET.tar.gz" --docker
          else
            sh tools/ci/tin.sh distribution_check "bin/dist/tin-$version-$TARGET.tar.gz"
          fi
      - name: Tinland.app builds with its icon (macOS)
        if: runner.os == 'macOS'
        run: |
          tools/dev/tinland_app.sh bin/app
          test -x bin/app/Tinland.app/Contents/MacOS/Tinland
          test -s bin/app/Tinland.app/Contents/Resources/Tinland.icns
          plutil -lint bin/app/Tinland.app/Contents/Info.plist
          codesign --verify --deep bin/app/Tinland.app
