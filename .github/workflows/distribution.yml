name: Distribution
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: distribution-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Archive and container (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: ubuntu-24.04
            target: linux-amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/ci -p 'test_distribution.py' -v
      - run: make bootstrap dist
      - name: Verify archive and Linux containers
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version=$(cat VERSION)
          if [ "$RUNNER_OS" = Linux ]; then
            python3 tools/ci/distribution_check.py "bin/dist/tin-$version-$TARGET.tar.gz" --docker
          else
            python3 tools/ci/distribution_check.py "bin/dist/tin-$version-$TARGET.tar.gz"
          fi
      - name: Tinland.app builds with its icon (macOS)
        if: runner.os == 'macOS'
        run: |
          tools/dev/tinland_app.sh bin/app
          test -x bin/app/Tinland.app/Contents/MacOS/Tinland
          test -s bin/app/Tinland.app/Contents/Resources/Tinland.icns
          plutil -lint bin/app/Tinland.app/Contents/Info.plist
          codesign --verify --deep bin/app/Tinland.app
