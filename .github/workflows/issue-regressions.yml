name: Issue regression audit

# Runs against the default branch, never code or commands taken from issue text.
on:
  issues:
    types: [closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check issue lifecycle against regression exemptions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/regressions.py --audit
