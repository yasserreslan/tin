name: Dev 488 (temporary)

# Temporary: a fast loop for #488 (Linux ratios of the arithmetic leaves). Removed before merge.
on:
  push:
    branches: [tin2/488-asm-leaves]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  dev:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install wrk
        run: sudo apt-get update -q && sudo apt-get install -y -q wrk
      - name: Build
        run: make bootstrap
      - name: Machine
        run: |
          uname -srm; lscpu | grep -E '^(Model name|Flags)' | cut -c1-400; go version
          grep -o -w 'bmi2\|adx\|sha_ni' /proc/cpuinfo | sort -u | tr '\n' ' ' || true
      - name: Arithmetic digest and generated files
        run: |
          bin/tinc -o bin/arith toolchain/tests/regressions/seal-arith.tin
          bin/arith | tee /tmp/hw.txt
          TIN_SEAL_SOFT=1 bin/arith | tee /tmp/soft.txt
          cmp /tmp/hw.txt /tmp/soft.txt
          python3 tools/ci/test_crypto_generated.py
      - name: CPU reference (Tin versus Go)
        run: BENCH_DIR=bench/v2 python3 bench/run.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: HTTPS reference (anvil.ServeTLS versus Go crypto/tls)
        run: |
          ./tin build bench/http/https.tin -o bin/https_bench
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/gotls" ./gotls
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/tlsload" ./tlsload
          python3 bench/http/run_https.py 5 5 | tee -a "$GITHUB_STEP_SUMMARY"
