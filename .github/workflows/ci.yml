name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04-arm
            arch: arm64
          - os: macos-15
            arch: arm64
          - os: ubuntu-24.04
            arch: amd64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Go is still needed by tools/ci/http_check.tin and iofs_check.tin (reference implementations).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64|amd64) arch=amd64 ;; *) arch=unknown ;; esac
          test "$arch" = "$EXPECTED_ARCH" || { echo "Expected native $EXPECTED_ARCH, got $(uname -m)"; exit 1; }
      - name: Test the test harness
        run: |
          for t in tools/ci/test_*.tin; do sh tools/ci/tin.sh $t; done
      - name: No Python programs, and STDLIB.md matches the sources
        run: |
          sh tools/ci/tin.sh python_policy_check
          sh tools/ci/tin.sh tools/gen/gendoc.tin --check
      - name: Build from seed and verify self-hosting fixed point
        run: make bootstrap
      - name: Strict language and standard library suite
        run: tools/dev/v2test.sh bin/tinc
      - name: Docs and examples are edition 1, and every docs code block compiles
        run: sh tools/ci/tin.sh docs_check bin/tinc
      - name: Exact number conversion (Go reference and hard parsing corpus)
        run: sh tools/ci/tin.sh number_check
      - name: Arbitrary-precision integers against Go's math/big (100,000 pairs)
        run: sh tools/ci/tin.sh abacus_check
      - name: XML token streams against Go's encoding/xml (RSS, SOAP, S3, SVG)
        run: sh tools/ci/tin.sh scroll_check
      - name: HTML tokens and escaping against golang.org/x/net/html (pages, generated documents, every named reference)
        run: sh tools/ci/tin.sh html_check
      - name: Regular expressions against Go's regexp (12,000 pairs and the ported tables)
        run: sh tools/ci/tin.sh lasso_check
      - name: HTML template URL attributes against Go's html/template (3,000 template/value pairs)
        run: sh tools/ci/tin.sh stencil_url_check
      - name: Generated integer and float code against Go (a differential fuzzer, 8 rounds)
        run: sh tools/ci/tin.sh numeric_fuzz 811 8 40
      - name: ServeFile against Go's http.ServeContent (1,500 generated conditional and range requests)
        run: sh tools/ci/tin.sh servefile_check
      - name: Multipart bodies against Go's mime/multipart (4,000 generated bodies)
        run: sh tools/ci/tin.sh multipart_check
      - name: PNG and image/draw pixel interoperability against Go
        run: sh tools/ci/tin.sh png_check
      - name: JPEG Go decode corpus and Tin encoder smoke test
        run: sh tools/ci/tin.sh jpeg_check
      - name: GIF frame and animation interoperability against Go
        run: sh tools/ci/tin.sh gif_check
      - name: Packed numbers and the small encodings against Go (10,000 cases)
        run: sh tools/ci/tin.sh pack_check
      - name: Stream helpers against Go's io (a generated chunk corpus)
        run: sh tools/ci/tin.sh io_check
      - name: Aligned columns against Go's text/tabwriter (every flag and padding)
        run: sh tools/ci/tin.sh column_check
      - name: io/fs and Pipe against Go (generated tree, paths and reader corpus)
        run: sh tools/ci/tin.sh iofs_check
      - name: CRC-64 and LZW against Go's hash/crc64 and compress/lzw (a generated corpus)
        run: sh tools/ci/tin.sh hash_check
      - name: Suffix array postings against Go's index/suffixarray (generated text and pattern corpus)
        run: sh tools/ci/tin.sh suffixarray_check
      - name: bzip2 against Go's compress/bzip2 (libbzip2 streams, cut, flipped and back to back)
        run: sh tools/ci/tin.sh bzip2_check
      - name: UTF-16 against Go's unicode/utf16 (a generated rune corpus)
        run: sh tools/ci/tin.sh utf16_check
      - name: Path rules against Go's path (Clean, Split, Join and Match)
        run: sh tools/ci/tin.sh path_check
      - name: MIME, quoted-printable and multipart against Go
        run: sh tools/ci/tin.sh mime_check
      - name: Mail parsing and text protocol framing against Go
        run: sh tools/ci/tin.sh mail_check
      - name: ASN.1 DER against Go's encoding/asn1 (generated values both ways, and mutated bytes)
        run: sh tools/ci/tin.sh asn1_check
      - name: gob streams against Go's encoding/gob (330 seeds encoded and decoded both ways, damaged streams)
        run: sh tools/ci/tin.sh gob_check
      - name: argo string escapes against Go's encoding/json (HTML characters, \b and \f)
        run: sh tools/ci/tin.sh argo_string_check
      - name: jsontext tokens, values and encoder against Go's encoding/json/jsontext (a generated corpus)
        run: sh tools/ci/tin.sh jsontext_check
      - name: jsonv2 Marshal and Unmarshal against Go's encoding/json/v2 (a generated corpus)
        run: sh tools/ci/tin.sh jsonv2_check
      - name: Users and groups against Go's os/user
        run: sh tools/ci/tin.sh user_check
      - name: container/list and container/ring against Go (generated and exhaustive small cases)
        run: sh tools/ci/tin.sh list_ring_check
      - name: expvar JSON served by anvil against Go's expvar handler (same registrations, 200 hits)
        run: sh tools/ci/tin.sh expvar_check
      - name: Complex functions against Go's math/cmplx (edge tables and a generated corpus, bit for bit)
        run: sh tools/ci/tin.sh cmplx_check
      - name: IP addresses, ports and prefixes against Go's net/netip (38,094 generated and edge cases)
        run: sh tools/ci/tin.sh netip_check
      - name: Tokens against Go's text/scanner (5,649 source texts, mode flags and Scan/Next/Peek orders)
        run: sh tools/ci/tin.sh scan_check
      - name: Testing helpers against Go's testing/iotest, testing/quick, testing/fstest and crypto/subtle
        run: sh tools/ci/tin.sh crucible_check
      - name: Child processes start, wait, signal and are cut by a deadline (native or Docker)
        run: sh tools/ci/tin.sh spawn_check
      - name: Operating system signals (dispositions, task delivery and per-core listeners)
        run: sh tools/ci/tin.sh signal_check
      - name: DEFLATE against Go (every length and distance code, both directions)
        run: sh tools/ci/tin.sh squash_twin_check
      - name: Streaming zlib against Go's compress/zlib (32 sizes and 4 GiB each way, 4 GiB in 1 MiB, damaged streams)
        run: sh tools/ci/tin.sh zlib_stream_check
      - name: ZIP archives against Go's archive/zip (both directions)
        run: sh tools/ci/tin.sh zip_check
      - name: ELF64 arm64 and amd64 metadata against Go, plus malformed-input faults
        run: sh tools/ci/tin.sh elf_check
      - name: Memory primitives and deterministic allocation failure
        run: sh tools/ci/tin.sh memory_check
      - name: Embedded file trees (the embed directive) against Go's file trees over the same patterns
        run: sh tools/ci/tin.sh embed_check
      - name: Task memory after a 300-request heavy burst
        run: sh tools/ci/tin.sh task_memory_check
      - name: Long-lived blocks above 4 KiB (slab classes to 256 KiB, kept mappings, mappings after deletes)
        run: sh tools/ci/tin.sh heap_check
      - name: shared let and atomic (one copy of a 100 MB table for 1 and 8 cores, an exact atomic count)
        run: sh tools/ci/tin.sh shared_check
      - name: Map growth (no insert into a growing long-lived map takes a millisecond)
        run: sh tools/ci/tin.sh map_growth_check
      - name: Reclamation with long-lived tasks (a parked WebSocket does not pin dropped blocks)
        run: sh tools/ci/tin.sh limbo_check
      - name: Arena blocks and CSV streaming (flat peak RSS; a 1 GiB file in a 64 KiB window)
        run: sh tools/ci/tin.sh arena_check
      - name: Replay tapes (record, replay, divergence)
        run: sh tools/ci/tin.sh replay_check
      - name: Scheduling replay (select winners)
        run: sh tools/ci/tin.sh sched_check
      - name: Raw Linux syscall ABI, signals, errors and directory iteration
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh syscall_check
      - name: Linux clone threads (returning cores, stack reaping, masks, child faults)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh thread_check
      - name: Static Linux executables (no interpreter, Tin _start, empty root)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh static_check
      - name: Exact calendar, errno, hostname, TTY and Linux symbol helpers
        run: sh tools/ci/tin.sh helpers_check
      - name: Float map keys against Go (-0 and +0 one key, NaN never found)
        run: sh tools/ci/tin.sh float_keys_check
      - name: Compiler path discovery and canonicalization
        run: sh tools/ci/tin.sh compiler_paths_check
      - name: Compile time of long expression chains (#713)
        run: sh tools/ci/tin.sh compile_time_check
      - name: Packages (tin vendor, offline builds from vendor/, tin.lock hashes)
        run: sh tools/ci/tin.sh packages_check
      - name: Linux DNS contract, transport and request deadlines
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh dns_check
      - name: Linux DNS caches (answers for their TTL, missing names, /etc/hosts re-read on change)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh dns_cache_check
      - name: JSON decoding against encoding/json (strict mode, atomic faults, UTF-8)
        run: sh tools/ci/tin.sh argo_twin_check
      - name: Cryptographic primitives (Wycheproof and hashlib vectors)
        run: sh tools/ci/tin.sh crypto_check
      - name: MD5, AES and DES blocks, RC4 and the CBC/CTR/CFB/OFB modes against Go (a generated corpus, both AES paths)
        run: sh tools/ci/tin.sh cipher_check
      - name: HPKE base mode (RFC 9180 vectors and Go crypto/hpke twin)
        run: sh tools/ci/tin.sh hpke_check
      - name: Dice v2 (PCG-DXSM and ChaCha8 streams and the RandV2 methods, against Go math/rand/v2)
        run: sh tools/ci/tin.sh dice_v2_check
      - name: Elliptic curves, DSA verification and FIPS status against Go (a generated corpus; #927)
        run: sh tools/ci/tin.sh nist_check
      - name: ML-DSA (FIPS 204 ACVP and Wycheproof vectors and the Go crypto/mldsa corpus; live Go where installed; #917)
        run: sh tools/ci/tin.sh mldsa_check
      - name: TLS 1.3 client (RFC 8448 trace, openssl and Python interop, https and wss)
        run: sh tools/ci/tin.sh tls_check
      - name: TLS 1.3 server (anvil.ServeTLS against openssl, Python and Tin clients; malformed handshakes, one core, shutdown)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh tls_server_check
      - name: Memory safety and issue-linked regressions
        run: sh tools/ci/tin.sh regressions
      - name: Request tasks (waits overlap, deadlines, pipelined order)
        run: sh tools/ci/tin.sh task_check
      - name: Router (parameters, middleware, 404/405 and waits under concurrent requests)
        run: sh tools/ci/tin.sh router_check
      - name: Runtime lifetimes (formatting, helper deadlines, WebSocket memory)
        run: sh tools/ci/tin.sh lifetime_check
      - name: Guards (defers and cleanup callbacks before the panic's fault)
        run: sh tools/ci/tin.sh guard_check
      - name: Boundary cancellation (every client wakes; cancels flow down only)
        run: sh tools/ci/tin.sh cancel_check
      - name: Structured concurrency in requests (scope, spawn, first-fault cancellation)
        run: sh tools/ci/tin.sh scope_check
      - name: Memory bounds (request budget, soft limit; 256 MiB cgroup on Linux)
        run: sh tools/ci/tin.sh memory_bounds_check
      - name: Format memory (say.Line and interpolation in a plain program run in constant memory)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh format_memory_check
      - name: Dyn memory (a dyn value replaced in long-lived memory is released)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh dyn_memory_check
      - name: Loop memory (binary-trees within 3x of Go's peak; a plain loop of temporaries under 16 MiB)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh loop_memory_check
      - name: File I/O through io_uring (Linux) and helper threads (concurrent reads, contents, FIFO deadlines, helper thread count)
        env:
          TIN_REQUIRE_IO_URING: ${{ runner.os == 'Linux' && '1' || '' }}
        run: sh tools/ci/tin.sh file_io_check
      - name: Server lifecycle (use, on, startup faults, drain then stop events)
        run: sh tools/ci/tin.sh lifecycle_check
      - name: Streaming responses (chunks, Content-Length, SendFile, server-sent events, flat memory)
        run: sh tools/ci/tin.sh stream_check
      # h2spec is pinned to a commit of its default branch: its v2 tags cannot be installed with go install.
      - name: HTTP/2 (h2spec, Go's HTTP/2 client, a gRPC client, frames, flow control, drain)
        run: |
          GOBIN="$RUNNER_TEMP/h2spec" go install github.com/summerwind/h2spec/cmd/h2spec@v1.5.1-0.20220625142712-af83a65f0b62
          H2SPEC="$RUNNER_TEMP/h2spec/h2spec" sh tools/ci/tin.sh h2_check
      - name: Request bodies read as they arrive (Router.Stream, 1 GiB uploads in flat memory, slow handlers, h2 and HTTPS)
        run: sh tools/ci/tin.sh stream_body_check
      - name: HTTP client keep-alive pool (connections reused, stale ones replaced, MaxIdle, https on one handshake)
        run: sh tools/ci/tin.sh wire_pool_check
      - name: HTTP/2 client (wire against Go's net/http and anvil over TLS and h2c, GOAWAY)
        run: sh tools/ci/tin.sh wire_h2_check
      - name: Held cores (stuck-core counters; SIGTERM while core 0 is held, Linux)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh wedge_check
      - name: CPU safepoints (deadline, defers, server recovery and Linux drain)
        run: sh tools/ci/tin.sh poll_check
      - name: Certificates and signatures (test PKI, Wycheproof, mutated certificates, against Go)
        run: sh tools/ci/tin.sh x509_check
      - name: Redis client (batching, deadlines, reconnects, AUTH)
        run: sh tools/ci/tin.sh redis_check
      - name: WebSocket server and client (RFC 6455 rules, many idle connections)
        run: sh tools/ci/tin.sh websocket_check
      - name: Kafka connections in an event loop (Close during a held fetch, group lanes, handshake deadlines)
        run: sh tools/ci/tin.sh kafka_check
      - name: MySQL client (pool, deadlines, auth plugins, reconnects)
        run: sh tools/ci/tin.sh mysql_check
      - name: MySQL client against the runner's MySQL 8 (Linux x86-64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          if ! systemctl list-unit-files mysql.service | grep -q '^mysql'; then echo "no MySQL on this runner"; exit 0; fi
          sudo systemctl start mysql.service
          mysql -uroot -proot -e "CREATE DATABASE IF NOT EXISTS tin; CREATE USER IF NOT EXISTS 'tin'@'%' IDENTIFIED WITH caching_sha2_password BY 'tinpass'; GRANT ALL ON tin.* TO 'tin'@'%'; FLUSH PRIVILEGES;"
          MYSQL_ADDR=127.0.0.1:3306 MYSQL_USER=tin MYSQL_PASSWORD=tinpass MYSQL_DATABASE=tin sh tools/ci/tin.sh mysql_check
      - name: PostgreSQL client (SCRAM, binary parameters, pool, transactions, reconnects)
        run: sh tools/ci/tin.sh postgres_check
      - name: Generic database/sql client against Go database/sql
        run: sh tools/ci/tin.sh dbsql_check
      - name: PostgreSQL client against the runner's PostgreSQL (Linux x86-64)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "SET password_encryption = 'scram-sha-256'; CREATE ROLE tin LOGIN PASSWORD 'tinpass';"
          sudo -u postgres createdb -O tin tin
          POSTGRES_ADDR=127.0.0.1:5432 POSTGRES_USER=tin POSTGRES_PASSWORD=tinpass POSTGRES_DATABASE=tin sh tools/ci/tin.sh postgres_check
      - name: HTTP correctness, RSS stability and shutdown (Linux)
        if: runner.os == 'Linux'
        run: sh tools/ci/tin.sh http_check
      - name: HTTP request and response dumps against Go's httputil
        run: sh tools/ci/tin.sh dump_check
      - name: HTTP client trace hooks against Go net/http
        run: sh tools/ci/tin.sh httptrace_check
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            bin/ci/**/*.log
            bin/ci/**/*.json
          retention-days: 14
          if-no-files-found: ignore

  issue-policy:
    name: Issue regression policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: No closed issue may retain a known-failure exemption
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh tools/ci/tin.sh regressions --audit

  gate:
    name: CI
    if: always()
    needs: [native, issue-policy]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          POLICY_RESULT: ${{ needs.issue-policy.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$POLICY_RESULT" = success
