name: Benchmarks (Linux)

# Native Linux measurements only; thresholds flag review, never bypass correctness CI.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base revision (empty uses the selected revision's first parent)
        type: string
        default: ''
      polls:
        description: Enable experimental CPU safepoints in the head compiler
        type: boolean
        default: false
  schedule:
    - cron: '0 6 * * 1'

defaults:
  run:
    shell: bash

env:
  TINC_POLLS: ${{ inputs.polls && '1' || '0' }}

permissions:
  contents: read

concurrency:
  group: bench-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison revisions
        id: revisions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          else
            base=$(git rev-parse --verify --end-of-options "${BASE_REF:-HEAD^}^{commit}")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          { echo "Base: $base"; echo "Head: $(git rev-parse HEAD)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.revisions.outputs.base }}
          path: bin/bench-base
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install wrk and h2load
        run: sudo apt-get update -q && sudo apt-get install -y -q wrk nghttp2-client
      - name: Build each revision from its own seed and source tree
        run: |
          make bootstrap
          make -C bin/bench-base bootstrap
      - name: Machine and measurement settings
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; *) exit 1 ;; esac
          test "$arch" = "$EXPECTED_ARCH"
          {
            echo "## Linux $EXPECTED_ARCH ($RUNNER_OS, GitHub-hosted, shared)"
            echo '```'
            echo "TINC_POLLS=$TINC_POLLS (head opt-in; base uses its committed default)"
            uname -srm
            lscpu | grep -E '^(Model name|CPU\(s\)):' || true
            go version
            wrk --version || true
            h2load --version || true
            echo '```'
            echo 'CPU: 7 alternating runs per side; medians. HTTP: 1 server core, wrk -t2 -c100, 10 s, 5 alternating rounds; load generator on the same runner.'
            echo 'HTTPS: 1 server core each (anvil.ServeTLS, Go crypto/tls), TLS 1.3, wrk -t2, 5 s, 5 alternating rounds: handshakes/s (Connection: close), keep-alive req/s, MiB/s of 1 MiB bodies.'
            echo 'CPU head/base is elapsed time (lower is faster); HTTP head/base is req/s (higher is faster). >5% regressions require a rerun and profile/maintainer review; timing is not an automatic merge gate.'
          } | tee bin/bench-machine.txt
          cat bin/bench-machine.txt >> "$GITHUB_STEP_SUMMARY"
      - name: CPU reference (Tin versus Go)
        run: |
          BENCH_DIR=bench/v2 python3 bench/run.py --json bin/bench-cpu-reference.json | tee bin/bench-cpu-reference.txt
          { echo '### CPU reference'; cat bin/bench-cpu-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: CPU base versus head
        run: |
          python3 bench/compare.py --base-root bin/bench-base --json bin/bench-cpu-compare.json | tee bin/bench-cpu-compare.txt
          { echo '### CPU revision comparison'; cat bin/bench-cpu-compare.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP reference (Tin versus Go)
        run: |
          ./tin build examples/api.tin -o bin/api
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/fast" ./fast
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/gonet" ./gonet
          bench/http/run_wrk.sh 1 2 100 10 5 --json bin/bench-http-reference.json | tee bin/bench-http-reference.txt
          { echo '### HTTP reference'; cat bin/bench-http-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTPS reference (anvil.ServeTLS versus Go crypto/tls)
        run: |
          ./tin build bench/http/https.tin -o bin/https_bench
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/gotls" ./gotls
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/tlsload" ./tlsload
          python3 bench/http/run_https.py 5 5 --json bin/bench-https-reference.json | tee bin/bench-https-reference.txt
          { echo '### HTTPS reference (anvil.ServeTLS versus Go crypto/tls)'; cat bin/bench-https-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP/2 reference (Tin versus Go net/http, h2c)
        run: |
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/goh2c" ./goh2c
          echo 'HTTP/2: 1 server core, h2load -t2 -c32 -m10 (h2c by prior knowledge), 10 s after a 2 s warm-up, 5 alternating rounds.' > bin/bench-h2-reference.txt
          python3 bench/http/run_h2load.py 1 2 32 10 10 5 --json bin/bench-h2-reference.json | tee -a bin/bench-h2-reference.txt
          { echo '### HTTP/2 reference'; cat bin/bench-h2-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP client (wire's HTTP/2 and HTTP/1.1 against Go's net/http client)
        run: |
          ./tin build bench/http/wire_load.tin -o bin/wire_load
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/goload" ./goload
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/goh2c" ./goh2c
          echo 'HTTP client: 1 client core each (wire, Go net/http with GOMAXPROCS=1) calling Go net/http (2 cores), 100 callers at once, 20000 GETs of /plaintext per round, 5 alternating rounds after a warm-up.' > bin/bench-wire.txt
          python3 bench/http/run_wire.py 20000 5 --json bin/bench-wire.json | tee -a bin/bench-wire.txt
          { echo '### HTTP client (wire)'; cat bin/bench-wire.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP base versus head
        run: |
          python3 bench/compare.py --suite http --base-root bin/bench-base --json bin/bench-http-compare.json | tee bin/bench-http-compare.txt
          { echo '### HTTP revision comparison'; cat bin/bench-http-compare.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: File reads (quarry.ReadFile of 10k files, io_uring versus helper threads)
        run: |
          python3 bench/files/run.py --json bin/bench-files.json | tee bin/bench-files.txt
          { echo '### File reads (head: io_uring versus TIN_IO_URING=0)'; echo '```'; cat bin/bench-files.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep raw samples and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-linux-${{ matrix.arch }}
          path: |
            bin/bench-*.txt
            bin/bench-*.json
            bin/wrk-*/*.log
            bin/h2load-*/*.log
          retention-days: 90
          if-no-files-found: ignore
