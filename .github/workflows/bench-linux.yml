name: Benchmarks (Linux)

# Native Linux measurements only; thresholds flag review, never bypass correctness CI.
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base revision (empty uses the selected revision's first parent)
        type: string
        default: ''
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'bench/**'
      - 'lib/**'
      - 'selfhost/**'
      - 'tools/ci/test_benchmarks.py'
      - '.github/workflows/bench-linux.yml'

permissions:
  contents: read

concurrency:
  group: bench-linux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve comparison revisions
        id: revisions
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base=$(git merge-base "$PR_BASE" HEAD)
          else
            base=$(git rev-parse --verify --end-of-options "${BASE_REF:-HEAD^}^{commit}")
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"
          { echo "Base: $base"; echo "Head: $(git rev-parse HEAD)"; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.revisions.outputs.base }}
          path: bin/bench-base
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Install wrk
        run: sudo apt-get update -q && sudo apt-get install -y -q wrk
      - name: Build each revision from its own seed and source tree
        run: |
          make bootstrap
          make -C bin/bench-base bootstrap
      - name: Machine and measurement settings
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64) arch=amd64 ;; *) exit 1 ;; esac
          test "$arch" = "$EXPECTED_ARCH"
          {
            echo "## Linux $EXPECTED_ARCH ($RUNNER_OS, GitHub-hosted, shared)"
            echo '```'
            uname -srm
            lscpu | grep -E '^(Model name|CPU\(s\)):' || true
            go version
            wrk --version || true
            echo '```'
            echo 'CPU: 7 alternating runs per side; medians. HTTP: 1 server core, wrk -t2 -c100, 10 s, 5 alternating rounds; load generator on the same runner.'
            echo 'CPU head/base is elapsed time (lower is faster); HTTP head/base is req/s (higher is faster). >5% regressions require a rerun and profile/maintainer review; timing is not an automatic merge gate.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: CPU reference (Tin versus Go)
        run: |
          BENCH_DIR=bench/v2 python3 bench/run.py --json bin/bench-cpu-reference.json | tee bin/bench-cpu-reference.txt
          { echo '### CPU reference'; cat bin/bench-cpu-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: CPU base versus head
        run: |
          python3 bench/compare.py --base-root bin/bench-base --json bin/bench-cpu-compare.json | tee bin/bench-cpu-compare.txt
          { echo '### CPU revision comparison'; cat bin/bench-cpu-compare.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP reference (Tin versus Go)
        run: |
          ./tin build examples/api.tin -o bin/api
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/fast" ./fast
          go -C bench/http build -o "$GITHUB_WORKSPACE/bin/gonet" ./gonet
          bench/http/run_wrk.sh 1 2 100 10 5 --json bin/bench-http-reference.json | tee bin/bench-http-reference.txt
          { echo '### HTTP reference'; cat bin/bench-http-reference.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP base versus head
        run: |
          python3 bench/compare.py --suite http --base-root bin/bench-base --json bin/bench-http-compare.json | tee bin/bench-http-compare.txt
          { echo '### HTTP revision comparison'; cat bin/bench-http-compare.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep raw samples and server logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-linux-${{ matrix.arch }}
          path: |
            bin/bench-*.txt
            bin/bench-*.json
            bin/wrk-*/*.log
          retention-days: 90
          if-no-files-found: ignore
