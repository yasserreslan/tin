name: Tin VS Code extension

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension:
    name: Editor (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build the compiler from the checked-in seed
        run: make bin/tinc
      - name: Install editor development dependencies
        working-directory: editors/vscode
        run: npm ci --ignore-scripts
      - name: Grammar, command, native compilation and test runner coverage
        working-directory: editors/vscode
        run: |
          TIN_VSCODE_COMPILER="$GITHUB_WORKSPACE/bin/tinc" TIN_ROOT="$GITHUB_WORKSPACE" npm test
      - name: Package the extension
        working-directory: editors/vscode
        run: npm run package
      - name: Upload installable extension
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tin-vscode-${{ matrix.os }}
          path: editors/vscode/*.vsix
          if-no-files-found: error
