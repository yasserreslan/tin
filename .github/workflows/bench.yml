name: Benchmark v0.4

# GET /users/{id} through Redis over MySQL: Tin vs Go + chi under wrk2 (bench/v04/run.tin).
# Runs on demand (Actions > Benchmark v0.4 > Run workflow); the host, the table, every round
# and the Tin/Go ratios go to the job summary. On the 4-vCPU runner the servers get CPUs 0-1
# to themselves; wrk2, Redis and MySQL share CPUs 2-3. Only the ratios are meaningful here.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds per scenario (servers alternate; the median is reported)
        default: '3'
      secs:
        description: Seconds per measured run
        default: '20'

permissions:
  contents: read

jobs:
  users:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      redis:
        image: redis:7.2
        ports: ['6379:6379']
        options: --cpuset-cpus=2,3
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bench
          MYSQL_USER: bench
          MYSQL_PASSWORD: benchpass
        ports: ['3306:3306']
        options: >-
          --cpuset-cpus=2,3
          --health-cmd="mysqladmin ping -h127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      REDIS_ADDR: 127.0.0.1:6379
      MYSQL_ADDR: 127.0.0.1:3306
      MYSQL_USER: bench
      MYSQL_PASSWORD: benchpass
      MYSQL_DATABASE: bench
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build Tin
        run: make bootstrap
      - name: Build wrk2
        run: |
          git clone --depth 1 https://github.com/giltene/wrk2.git /tmp/wrk2
          make -C /tmp/wrk2 -j4 > /tmp/wrk2/build.log 2>&1 || { tail -30 /tmp/wrk2/build.log; exit 1; }
      - name: Seed MySQL
        run: sh tools/ci/tin.sh bench/v04/seed.tin | mysql -h127.0.0.1 -P3306 -ubench -pbenchpass bench
      - name: Record the host
        run: |
          test "$(nproc)" -ge 4 || { echo "need 4 CPUs, have $(nproc)"; exit 1; }
          {
            echo '```'
            echo "runner: $ImageOS $ImageVersion, $(nproc) CPUs"
            lscpu | grep -E '^(Model name|Architecture|Thread|Core|Socket|Hypervisor)'
            echo "kernel: $(uname -srm)"
            go version
            echo "redis: $(docker exec ${{ job.services.redis.id }} redis-server --version)"
            echo "mysql: $(docker exec ${{ job.services.mysql.id }} mysqld --version)"
            echo "wrk2: giltene/wrk2@$(git -C /tmp/wrk2 rev-parse --short HEAD)"
            echo "tin: $(git rev-parse --short HEAD)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run (2 cores per server, wrk2 with 2 threads)
        env:
          WRK2: /tmp/wrk2/wrk
          CORES: '2'
          THREADS: '2'
          CONNS: '128'
          SERVER_CPUS: '0,1'
          WRK_CPUS: '2,3'
          ROUNDS: ${{ inputs.rounds }}
          SECS: ${{ inputs.secs }}
        run: |
          sh tools/ci/tin.sh bench/v04/run.tin | tee /tmp/bench.txt
          { echo '```'; cat /tmp/bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
